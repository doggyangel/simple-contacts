[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_contacts"
version = "2026.0.0"
requires-python = ">= 3.14.6"
authors = [
    {name = "Georgia O'Reilly", email = "sharkpuppygirl@pm.me"}
]
description = "a very simple command line contact book"
license = "MIT"
license-files = "LICENSE"
keywords = ["contact manager", "CLI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities"
]

[project.scripts]
contacts = "simpleContact_0.0.5:start"